# Spring Boot -> Logback (logs/app.json) -> Filebeat -> Logstash -> Elasticsearch -> Kibana
# Spring Boot -> OTLP -> Jaeger (distributed tracing)
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false   # local demo only
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ["9200:9200"]

  # One-shot: installs the index template (date_nanos timestamps, keyword IDs) before any log arrives
  es-setup:
    image: curlimages/curl:8.10.1
    volumes:
      - ./ops/elasticsearch/app-logs-template.json:/template.json:ro
    entrypoint: ["sh", "-c"]   # the image's default entrypoint is curl itself
    command:
      - >-
        until curl -sf http://elasticsearch:9200/_cluster/health; do sleep 2; done &&
        curl -sf -X PUT http://elasticsearch:9200/_index_template/app-logs
        -H 'Content-Type: application/json' --data-binary @/template.json
    depends_on: [elasticsearch]

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    environment:
      - XPACK_MONITORING_ENABLED=false   # avoids license-check errors against the security-disabled ES
    volumes:
      - ./ops/logstash/pipeline.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      es-setup:
        condition: service_completed_successfully

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./ops/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/logs:ro
    depends_on: [logstash]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports: ["5601:5601"]
    depends_on: [elasticsearch]

  # One-shot: imports the "Errors by requestId" dashboard (regenerate with ops/kibana/build_dashboard.py)
  kibana-setup:
    image: curlimages/curl:8.10.1
    volumes:
      - ./ops/kibana/dashboard.ndjson:/dashboard.ndjson:ro
    entrypoint: ["sh", "-c"]
    command:
      - >-
        until curl -s http://kibana:5601/api/status | grep -q '"level":"available"'; do sleep 3; done &&
        curl -sf -X POST 'http://kibana:5601/api/saved_objects/_import?overwrite=true'
        -H 'kbn-xsrf: true' --form file=@/dashboard.ndjson
    depends_on: [kibana]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP/HTTP receiver
