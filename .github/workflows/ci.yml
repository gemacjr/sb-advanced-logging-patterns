name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches dependencies and validates the Gradle wrapper checksum
      - uses: gradle/actions/setup-gradle@v6

      - name: Build and run tests
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/

  ops-config:
    name: Validate ops config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: docker-compose.yml is valid
        run: docker compose config --quiet

      - name: ES index template is valid JSON
        run: python3 -m json.tool ops/elasticsearch/app-logs-template.json > /dev/null

      # dashboard.ndjson is generated; fail if someone hand-edited it or forgot to regenerate
      - name: Kibana dashboard is in sync with its generator
        run: |
          python3 ops/kibana/build_dashboard.py
          git diff --exit-code ops/kibana/dashboard.ndjson
