input {
  beats {
    port => 5044
  }
}

filter {
  # Filebeat adds its own host/agent/ecs metadata; drop the noise
  mutate {
    remove_field => ["agent", "ecs", "input", "log", "host", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # One index per service per day: app-logs-order-service-2026.07.19
    # Not "logs-*-*": Elasticsearch 8 reserves that pattern for data streams, which reject plain index writes
    index => "app-logs-%{[service]}-%{+YYYY.MM.dd}"
  }
}
